services:
  backend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm install && npm run start"
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - JWT_SECRET=dev_secret_change_me
      - CORS_ORIGIN=http://localhost:3000
  dashboard:
    image: nginx:alpine
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
    ports:
      - "3000:80"
